[package]
name = "erebus-trainer"
version = "2.0.1"
edition = "2024"

[dependencies.bullet_lib]
git = "https://github.com/jw1912/bullet.git"
default-features = false
# Requires an NVIDIA GPU + CUDA toolkit at build time. On a CPU-only box
# this fails to compile; drop `features` back to `[]` there to get the
# MockGPU runtime (builds, but can't train).
features = ["cuda"]

[dependencies]
bulletformat = "1.8.0"
sfbinpack = "0.6"